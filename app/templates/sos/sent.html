<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Message | MemoryCare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="sos-page">
    <main class="sos-card sos-sent-card">
        <p class="eyebrow">Emergency SOS</p>
        <h1>Emergency text message sent</h1>
        <p class="sos-success">The emergency message has been sent to {{ alert.recipient_name }} at {{ alert.recipient_phone }}.</p>
        <a class="cancel-sos" href="{{ url_for('main.home') }}">Return home</a>
    </main>
</body>
</html>
