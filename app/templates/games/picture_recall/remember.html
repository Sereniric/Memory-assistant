<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Recall - Remember</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
</head>

<body>
    <main class="game-container">
        <section class="game-card">
            <h1 class="game-title">🖼️ Remember These Pictures</h1>
            <p class="game-subtitle">Memorize the picture cards below. Level: {{ level }}</p>

            <div class="item-grid">
                {% for item in items %}
                    <div class="item-option picture-item">
                        <span>{{ item }}</span>
                    </div>
                {% endfor %}
            </div>

            <a href="{{ url_for('picture_recall.select') }}" class="btn">I'm Ready</a>
        </section>
    </main>
</body>

</html>
