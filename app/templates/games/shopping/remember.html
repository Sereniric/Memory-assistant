<!DOCTYPE html>
<html lang="{{ current_lang }}">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ t('games.shopping_title') }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

    <main class="game-container">

        <section class="game-card">

            <h1 class="game-title">
                🛒 {{ t('games.recall_remember_title') }}
            </h1>

            <p class="game-subtitle">
                {{ t('games.picture_remember_hint') }} {{ t('games.level') }}: {{ level }}
            </p>

            <div class="item-grid">

                {% for item in items %}

                    <div class="item-option">
                        <span>
                            {{ item }}
                        </span>
                    </div>

                {% endfor %}

            </div>

            <a
                href="{{ url_for('shopping_memory.select') }}"
                class="btn"
            >
                {{ t('games.ready') }}
            </a>

        </section>

    </main>

</body>

</html>
