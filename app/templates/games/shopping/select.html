<!DOCTYPE html>
<html lang="{{ current_lang }}">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ t('games.shopping_title') }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

    <main class="game-container">

        <section class="game-card">

            <h1 class="game-title">
                🛒 {{ t('games.recall_select_title') }}
            </h1>

            <p class="game-subtitle">
                {{ t('games.recall_select_hint') }}
            </p>

            <div class="status">

                <span>
                    {{ t('games.level') }}: {{ level }}
                </span>

                <span>
                    {{ t('games.score') }}: {{ score }}
                </span>

                <span>
                    ❤️ {{ lives }}
                </span>

            </div>


            <form
                method="POST"
                action="{{ url_for('shopping_memory.submit') }}"
            >

                <div class="item-grid">

                    {% for item in options %}

                        <label class="item-option">

                            <input
                                type="checkbox"
                                name="items"
                                value="{{ item }}"
                            >

                            <span>
                                {{ item }}
                            </span>

                        </label>

                    {% endfor %}

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    {{ t('games.submit_answer') }}
                </button>

            </form>

        </section>

    </main>

</body>

</html>
