<!DOCTYPE html>
<html lang="{{ current_lang }}">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ t('games.sequence_intro_title') }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

    <main class="game-container">

        <section class="game-card">

            <h1 class="game-title">
                🧠 {{ t('games.sequence_intro_title') }}
            </h1>

            <p class="game-subtitle">
                {{ t('games.sequence_intro_subtitle') }}
            </p>

            <div class="game-option">

                <h2>
                    {{ t('games.sequence_how') }}
                </h2>

                <p>
                    {{ t('games.sequence_how_text') }}
                </p>

            </div>

            <div class="game-option">

                <h2>
                    🎯 {{ t('games.sequence_goal') }}
                </h2>

                <p>
                    {{ t('games.sequence_goal_text') }}
                </p>

            </div>

            <a
                href="{{ url_for('games.remember') }}"
                class="btn"
            >
                {{ t('games.start') }}
            </a>

            <br>

            <a
                href="{{ url_for('games.start') }}"
                class="back-link"
            >
                {{ t('games.sequence_back') }}
            </a>

        </section>

    </main>

</body>

</html>
