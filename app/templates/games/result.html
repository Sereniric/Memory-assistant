<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

    <main class="game-container">

        <section class="game-card">

            {% if accuracy >= 80 %}

                <h1 class="game-title">
                     Great Job!
                </h1>

            {% elif accuracy >= 50 %}

                <h1 class="game-title">
                     Good Try!
                </h1>

            {% else %}

                <h1 class="game-title">
                     Keep Practicing!
                </h1>

            {% endif %}


            <div class="result-score">
                {{ correct }}/{{ sequence|length }}
            </div>

            <p class="result-message">
                Accuracy: {{ "%.0f"|format(accuracy) }}%
            </p>

            <p>
                Current difficulty:
                <strong>{{ difficulty|upper }}</strong>
            </p>

            <p>
                Next difficulty:
                <strong>{{ new_difficulty|upper }}</strong>
            </p>

            <br>

            <a
                href="{{ url_for('games.remember') }}"
                class="btn"
            >
                Next Round
            </a>

        </section>

    </main>

</body>

</html>
