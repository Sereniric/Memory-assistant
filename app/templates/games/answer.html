<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Answer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

    <main class="game-container">

        <section class="game-card">

            <h1 class="game-title">
                What Was the Sequence?
            </h1>

            <p class="game-subtitle">
                Enter the numbers in the same order.
            </p>

            <form
                method="POST"
                action="{{ url_for('games.submit') }}"
            >

                <input
                    type="text"
                    name="answer"
                    class="answer-input"
                    placeholder="Example: 4 8 2"
                    autocomplete="off"
                    required
                >

                <br>

                <button
                    type="submit"
                    class="btn"
                >
                    Submit Answer
                </button>

            </form>

        </section>

    </main>

</body>

</html>
