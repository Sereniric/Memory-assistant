<!DOCTYPE html>
<html lang="{{ current_lang }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ t('games.answer_title') }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

    <main class="game-container">

        <section class="game-card">

            <h1 class="game-title">
                {{ t('games.answer_title') }}
            </h1>

            <p class="game-subtitle">
                {{ t('games.answer_subtitle') }}
            </p>

            <form
                method="POST"
                action="{{ url_for('games.submit') }}"
                id="sequence-answer-form"
            >

                <input
                    type="text"
                    name="answer"
                    class="answer-input"
                    placeholder="{{ t('games.answer_placeholder') }}"
                    autocomplete="off"
                    required
                >

                <br>

                <button
                    type="submit"
                    class="btn"
                >
                    {{ t('games.submit_answer') }}
                </button>

            </form>

            <div
                class="voice-input"
            >
                <h2>{{ t('games.or_speak') }}</h2>

                <form
                    method="POST"
                    action="{{ url_for('games.voice_answer') }}"
                    enctype="multipart/form-data"
                >

                    <input
                        type="file"
                        name="voice_answer"
                        accept="audio/*"
                        capture
                        required
                    >

                    <button
                        type="submit"
                        class="btn voice-button"
                    >
                        🎙 {{ t('games.record_audio') }}
                    </button>

                </form>

                {% if voice_error %}
                    <p class="voice-status">{{ voice_error }}</p>
                {% endif %}

                {% if voice_transcript %}
                    <div class="voice-confirmation">
                        <p>
                            {{ t('games.voice_you_said') }}
                            <strong>{{ voice_transcript }}</strong>
                        </p>

                        <form
                            method="POST"
                            action="{{ url_for('games.submit') }}"
                        >
                            <input
                                type="hidden"
                                name="answer"
                                value="{{ voice_answer }}"
                            >

                            <button type="submit" class="btn">
                                {{ t('games.use_answer') }}
                            </button>

                            <a
                                href="{{ url_for('games.answer') }}"
                                class="voice-retry"
                            >
                                {{ t('games.try_again') }}
                            </a>
                        </form>
                    </div>
                {% endif %}
            </div>

        </section>

    </main>

</body>

</html>
