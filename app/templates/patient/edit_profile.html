<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient Details | SIH 26003</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-page">
    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <p class="eyebrow">Patient Profile</p>
                <h1>Edit Patient Details</h1>
                <p class="dashboard-intro">Keep the patient's core information accurate and up to date.</p>
            </div>
            <a class="text-link" href="{{ url_for('patient.index') }}">Cancel</a>
        </header>

        <section class="dashboard-section">
            {% if sos_setup %}
            <div class="sos-setup-note">
                Add a family member's name and phone number so the Emergency SOS button knows where to send the alert.
            </div>
            {% endif %}
            <form method="POST" action="{{ url_for('patient.edit_profile') }}">

                <div class="form-grid">
                    <div class="form-field">
                        <label for="name">Full name</label>
                        <input type="text" id="name" name="name" value="{{ patient.name }}" required>
                    </div>

                    <div class="form-field">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" min="0" max="130" value="{{ patient.age or '' }}">
                    </div>

                    <div class="form-field">
                        <label for="gender">Gender</label>
                        <input type="text" id="gender" name="gender" value="{{ patient.gender or '' }}" placeholder="e.g. Female">
                    </div>

                    <div class="form-field">
                        <label for="dementia_stage">Dementia stage</label>
                        <select id="dementia_stage" name="dementia_stage">
                            <option value="mild" {% if patient.dementia_stage == "mild" %}selected{% endif %}>Mild</option>
                            <option value="moderate" {% if patient.dementia_stage == "moderate" %}selected{% endif %}>Moderate</option>
                            <option value="severe" {% if patient.dementia_stage == "severe" %}selected{% endif %}>Severe</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="diagnosis_date">Diagnosis date</label>
                        <input type="date" id="diagnosis_date" name="diagnosis_date" value="{{ patient.diagnosis_date or '' }}">
                    </div>

                    <div class="form-field">
                        <label for="caregiver_name">SOS family member</label>
                        <input type="text" id="caregiver_name" name="caregiver_name" value="{{ patient.caregiver_name or '' }}" placeholder="e.g. Priya Sharma">
                    </div>

                    <div class="form-field">
                        <label for="caregiver_phone">SOS family member phone</label>
                        <input type="text" id="caregiver_phone" name="caregiver_phone" value="{{ patient.caregiver_phone or '' }}" placeholder="e.g. +91 98765 43210">
                    </div>

                    <div class="form-field">
                        <label for="emergency_contact">Emergency contact</label>
                        <input type="text" id="emergency_contact" name="emergency_contact" value="{{ patient.emergency_contact or '' }}" placeholder="Name and phone number">
                    </div>

                    <div class="form-field full-width">
                        <label for="notes">Additional notes</label>
                        <textarea id="notes" name="notes" placeholder="Anything else caregivers should know">{{ patient.notes or '' }}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Details</button>
                    <a class="btn-secondary" href="{{ url_for('patient.index') }}">Cancel</a>
                </div>

            </form>
        </section>

    </main>
</body>
</html>
