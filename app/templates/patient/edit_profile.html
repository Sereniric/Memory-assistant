<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('patient.edit_title') }} | SIH 26003</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-page">
    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <p class="eyebrow">{{ t('patient.profile') }}</p>
                <h1>{{ t('patient.edit_title') }}</h1>
                <p class="dashboard-intro">{{ t('patient.keep_info') }}</p>
            </div>
            <a class="text-link" href="{{ url_for('patient.index') }}">{{ t('caregiver.cancel') }}</a>
        </header>

        <section class="dashboard-section">
            <form method="POST" action="{{ url_for('patient.edit_profile') }}">

                <div class="form-grid">
                    <div class="form-field">
                        <label for="name">{{ t('patient.full_name') }}</label>
                        <input type="text" id="name" name="name" value="{{ patient.name }}" required>
                    </div>

                    <div class="form-field">
                        <label for="age">{{ t('patient.age') }}</label>
                        <input type="number" id="age" name="age" min="0" max="130" value="{{ patient.age or '' }}">
                    </div>

                    <div class="form-field">
                        <label for="gender">{{ t('patient.gender') }}</label>
                        <input type="text" id="gender" name="gender" value="{{ patient.gender or '' }}" placeholder="{{ t('patient.default_gender_placeholder') }}">
                    </div>

                    <div class="form-field">
                        <label for="dementia_stage">{{ t('patient.dementia_stage_label') }}</label>
                        <select id="dementia_stage" name="dementia_stage">
                            <option value="mild" {% if patient.dementia_stage == "mild" %}selected{% endif %}>{{ t('patient.mild') }}</option>
                            <option value="moderate" {% if patient.dementia_stage == "moderate" %}selected{% endif %}>{{ t('patient.moderate') }}</option>
                            <option value="severe" {% if patient.dementia_stage == "severe" %}selected{% endif %}>{{ t('patient.severe') }}</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="diagnosis_date">{{ t('patient.diagnosis_date_label') }}</label>
                        <input type="date" id="diagnosis_date" name="diagnosis_date" value="{{ patient.diagnosis_date or '' }}">
                    </div>

                    <div class="form-field">
                        <label for="caregiver_name">{{ t('patient.caregiver_name') }}</label>
                        <input type="text" id="caregiver_name" name="caregiver_name" value="{{ patient.caregiver_name or '' }}" placeholder="{{ t('patient.default_caregiver_placeholder') }}">
                    </div>

                    <div class="form-field">
                        <label for="caregiver_phone">{{ t('patient.caregiver_phone_label') }}</label>
                        <input type="text" id="caregiver_phone" name="caregiver_phone" value="{{ patient.caregiver_phone or '' }}" placeholder="{{ t('patient.default_phone_placeholder') }}">
                    </div>

                    <div class="form-field">
                        <label for="emergency_contact">{{ t('patient.emergency_contact_label') }}</label>
                        <input type="text" id="emergency_contact" name="emergency_contact" value="{{ patient.emergency_contact or '' }}" placeholder="{{ t('patient.default_emergency_placeholder') }}">
                    </div>

                    <div class="form-field full-width">
                        <label for="notes">{{ t('patient.additional_notes') }}</label>
                        <textarea id="notes" name="notes" placeholder="{{ t('patient.default_notes_placeholder') }}">{{ patient.notes or '' }}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">{{ t('patient.save_details') }}</button>
                    <a class="btn-secondary" href="{{ url_for('patient.index') }}">{{ t('caregiver.cancel') }}</a>
                </div>

            </form>
        </section>

    </main>
</body>
</html>
