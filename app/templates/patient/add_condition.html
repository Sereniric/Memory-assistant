<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('patient.condition') }} | SIH 26003</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-page">
    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <p class="eyebrow">{{ t('patient.health_record') }}</p>
                <h1>🩺 {{ t('patient.condition') }}</h1>
                <p class="dashboard-intro">{{ t('patient.conditions_help') }}</p>
            </div>
            <a class="text-link" href="{{ url_for('patient.index') }}">{{ t('caregiver.cancel') }}</a>
        </header>

        <section class="dashboard-section">
            <form method="POST" action="{{ url_for('patient.add_condition') }}">

                <div class="form-grid">
                    <div class="form-field">
                        <label for="name">{{ t('patient.condition_name') }}</label>
                        <input type="text" id="name" name="name" placeholder="{{ t('patient.condition_placeholder') }}" required>
                    </div>

                    <div class="form-field">
                        <label for="status">{{ t('patient.status_label') }}</label>
                        <select id="status" name="status">
                            <option value="active">{{ t('patient.active') }}</option>
                            <option value="managed">{{ t('patient.managed') }}</option>
                            <option value="resolved">{{ t('patient.resolved') }}</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="diagnosed_date">{{ t('patient.diagnosed_on') }}</label>
                        <input type="date" id="diagnosed_date" name="diagnosed_date">
                    </div>

                    <div class="form-field full-width">
                        <label for="notes">{{ t('patient.notes_label') }}</label>
                        <textarea id="notes" name="notes" placeholder="{{ t('patient.default_condition_note') }}"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">{{ t('patient.save_condition') }}</button>
                    <a class="btn-secondary" href="{{ url_for('patient.index') }}">{{ t('caregiver.cancel') }}</a>
                </div>

            </form>
        </section>

    </main>
</body>
</html>
