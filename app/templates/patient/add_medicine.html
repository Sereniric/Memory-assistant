<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('patient.medicine') }} | SIH 26003</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-page">
    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <p class="eyebrow">{{ t('patient.medication') }}</p>
                <h1>💊 {{ t('patient.medicine') }}</h1>
                <p class="dashboard-intro">{{ t('patient.medicine_help') }}</p>
            </div>
            <a class="text-link" href="{{ url_for('patient.index') }}">{{ t('caregiver.cancel') }}</a>
        </header>

        <section class="dashboard-section">
            <form method="POST" action="{{ url_for('patient.add_medicine') }}">

                <div class="form-grid">
                    <div class="form-field">
                        <label for="name">{{ t('patient.medicine_name') }}</label>
                        <input type="text" id="name" name="name" placeholder="{{ t('patient.medicine_placeholder') }}" required>
                    </div>

                    <div class="form-field">
                        <label for="dosage">{{ t('patient.dosage') }}</label>
                        <input type="text" id="dosage" name="dosage" placeholder="e.g. 5 mg">
                    </div>

                    <div class="form-field">
                        <label for="frequency">{{ t('patient.frequency') }}</label>
                        <input type="text" id="frequency" name="frequency" placeholder="e.g. Once daily, after breakfast">
                    </div>

                    <div class="form-field full-width">
                        <label for="notes">{{ t('patient.notes_label') }}</label>
                        <textarea id="notes" name="notes" placeholder="{{ t('patient.default_medicine_note') }}"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">{{ t('patient.save_medicine') }}</button>
                    <a class="btn-secondary" href="{{ url_for('patient.index') }}">{{ t('caregiver.cancel') }}</a>
                </div>

            </form>
        </section>

    </main>
</body>
</html>
